<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}myShop{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f1ea; color: #2b2b2b; }
        header { background: #3e2c23; color: #fff; padding: 16px 0; }
        header .wrap { display: flex; justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; }
        header nav a { margin-left: 16px; opacity: .85; }
        header nav a:hover { opacity: 1; }
        .logo { font-size: 22px; font-weight: bold; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
        main { padding: 32px 0; }
        h1 { margin-top: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08);
                text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: transform .15s; }
        .card:hover { transform: translateY(-4px); }
        .card img, .no-cover { width: 100%; height: 300px; object-fit: cover; background: #ddd; }
        .no-cover { display: flex; align-items: center; justify-content: center; color: #888; }
        .card-body { padding: 14px; flex: 1; }
        .card-body h3 { margin: 0 0 6px; font-size: 17px; }
        .muted { color: #777; font-size: 14px; }
        .price { color: #a0522d; font-weight: bold; margin-top: 8px; }
        .badge { display: inline-block; background: #e8dccb; padding: 3px 10px; border-radius: 12px; font-size: 13px; }
        .detail { display: flex; gap: 32px; background: #fff; padding: 24px; border-radius: 10px; flex-wrap: wrap; }
        .detail img, .detail .no-cover { width: 300px; height: 440px; border-radius: 8px; }
        .detail-info { flex: 1; min-width: 260px; }
        .detail-info table { border-collapse: collapse; margin: 16px 0; }
        .detail-info td { padding: 6px 16px 6px 0; }
        .detail-info td:first-child { color: #777; }
        .btn { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #3e2c23; color: #fff;
               border-radius: 6px; text-decoration: none; }
        .empty { background: #fff; padding: 24px; border-radius: 10px; }
        .filters { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; align-items: center; }
        .filters input, .filters select, .order-form input, .order-form select, .order-form textarea {
            padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
        .filters input { flex: 1; min-width: 200px; }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eee; }
        .table th { background: #faf7f2; font-size: 14px; color: #555; }
        .table a { text-decoration: none; }
        .info { border-collapse: collapse; margin: 16px 0; }
        .info td { padding: 6px 24px 6px 0; vertical-align: top; }
        .info td:first-child { color: #777; }
        .status { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 13px; background: #e8dccb; }
        .status-new { background: #dbeafe; color: #1e40af; }
        .status-paid { background: #fef3c7; color: #92400e; }
        .status-shipped { background: #ede9fe; color: #5b21b6; }
        .status-delivered { background: #dcfce7; color: #166534; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }
        .order-form .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
        .order-form label { font-size: 14px; color: #555; }
        .error { color: #b91c1c; font-size: 13px; }
        .btn { border: none; cursor: pointer; font: inherit; margin-right: 6px; }
        .btn-danger { background: #b91c1c; }
        .btn-light { background: #e8dccb; color: #3e2c23; }
        .auth-box { max-width: 520px; margin: 0 auto; }
        .order-form input[type=file] { border: none; padding-left: 0; }
        .captcha { vertical-align: middle; margin-right: 8px; border-radius: 4px; }
        .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; background: #dbeafe; color: #1e40af; }
        .message-success { background: #dcfce7; color: #166534; }
        .message-error { background: #fee2e2; color: #991b1b; }
        footer { text-align: center; padding: 24px; color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <a href="{% url 'product_list' %}" class="logo">🛒 myShop</a>
            <nav>
                <a href="{% url 'product_list' %}">Товары</a>
                <a href="/admin/">Админка</a>
            </nav>
        </div>
    </header>
    <main class="wrap">
        {% block content %}{% endblock %}
    </main>
    <footer>myShop — домашнее задание по Django</footer>
</body>
</html>
